<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head('Create account')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main>
<form th:action="@{/register}" method="post" class="box narrow"><h1>Create account</h1><p class="err" th:text="${error}"></p>
<label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password (6+ characters)</label><input name="password" type="password" minlength="6" required><button class="p">Create account</button><p>Already registered? <a th:href="@{/login}">Log in</a></p></form></main></body></html>
