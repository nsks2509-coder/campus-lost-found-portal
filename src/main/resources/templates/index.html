<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head('Find your item')}"></head><body><nav th:replace="~{fragments :: nav}"></nav>
<section class="hero"><div><h1>Lost something on campus? Someone may have already found it.</h1><p>Search items handed in by students, or post what you lost or found.</p>
<form method="get" class="search"><input name="q" th:value="${q}" placeholder="Try black wallet or student ID" aria-label="Search"><select name="category" aria-label="Category"><option value="">All categories</option><option th:each="c:${cats}" th:value="${c}" th:text="${c}" th:selected="${c==category}"></option></select><select name="type" aria-label="Lost or found"><option value="">Lost and found</option><option value="LOST" th:selected="${type=='LOST'}">Lost</option><option value="FOUND" th:selected="${type=='FOUND'}">Found</option></select><button class="p">Search</button></form></div></section>
<main><div class="grid"><a class="tag" th:each="i:${items}" th:href="@{/items/{id}(id=${i.id})}"><div class="tag-top" th:classappend="${i.type}"><span th:text="${i.typeLabel()}"></span><span class="hole"></span><span class="st" th:classappend="'s-'+${i.status}" th:text="${i.statusLabel()}"></span></div>
<img th:if="${i.imagePath}" th:src="@{${i.imagePath}}" alt=""><div class="ph" th:unless="${i.imagePath}" th:text="${i.category}"></div>
<div class="tag-body"><h3 th:text="${i.title}"></h3><small th:text="${i.category}+' at '+${i.location}"></small></div></a></div>
<div class="box" th:if="${#lists.isEmpty(items)}"><h3>Nothing matches yet</h3><p>Try fewer words or another category, or <a th:href="@{/items/new}">post the item yourself</a>.</p></div></main></body></html>
