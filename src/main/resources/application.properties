spring.datasource.url=${DB_URL:jdbc:h2:file:./data/lostfound}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_SIZE:5MB}
server.port=${PORT:8080}
app.expiry-days=${APP_EXPIRY_DAYS:30}
app.upload.max-bytes=${APP_UPLOAD_MAX_BYTES:5242880}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Campus Administrator}
app.admin.legacy-email=${LEGACY_ADMIN_EMAIL:admin@campus.edu}
